<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark & Christine | Wedding Invitation</title>

    <meta name="theme-color" content="#7A9E7E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
OPENING SCREEN
========================= -->

<section id="opening-screen">

    <div class="background"></div>

    <div class="overlay"></div>

    <div id="petals"></div>

    <div class="welcome-card">

        <div class="monogram">
            M <span>&</span> C
        </div>

        <p class="family">
            Together with our families
        </p>

        <h1>Mark Andro</h1>

        <h2>&</h2>

        <h1>Christine Mae</h1>

        <div class="line"></div>

        <h3>April 27, 2027</h3>

        <button id="openBtn">
            Open Invitation
        </button>

    </div>

</section>

<!-- =========================
MAIN WEBSITE
========================= -->

<main id="website">

    <!-- HERO -->

    <section class="hero">

        <img src="assets/images/hero.jpg" alt="Mark and Christine">

        <div class="hero-overlay">

            <p>We're getting married</p>

            <h1>
                Mark Andro
            </h1>

            <h2>&</h2>

            <h1>
                Christine Mae
            </h1>

            <h3>
                April 27, 2027
            </h3>

        </div>

    </section>

    <!-- COUNTDOWN -->

    <section class="countdown-section">

        <h2>Counting the Days</h2>

        <div class="countdown">

            <div>
                <span id="days">0</span>
                <small>Days</small>
            </div>

            <div>
                <span id="hours">0</span>
                <small>Hours</small>
            </div>

            <div>
                <span id="minutes">0</span>
                <small>Minutes</small>
            </div>

            <div>
                <span id="seconds">0</span>
                <small>Seconds</small>
            </div>

        </div>

    </section>

</main>

<!-- MUSIC -->

<audio id="bgMusic" loop>
    <source src="assets/music/andam-na-ko-jazz.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">
    ♪
</button>

<script src="script.js"></script>

</body>

</html>
