        html{scroll-behavior:smooth}
        body{font-family:'Inter',sans-serif;background:#FFFBF7}
        .playfair{font-family:'Playfair Display',serif}
        .great{font-family:'Great Vibes',cursive}
        .corm{font-family:'Cormorant Garamond',serif}
        .reveal{opacity:0; transform:translateY(22px); transition: opacity .95s cubic-bezier(.2,.8,.2,1), transform .95s cubic-bezier(.2,.8,.2,1)}
        .reveal.in-view{opacity:1; transform:translateY(0)}

          -webkit-background-clip:text;
          -webkit-text-fill-color:transparent;
          background-clip:text;
          background-size:200% auto;
          animation: shimmer 5s linear infinite;
          letter-spacing:0.02em;
          filter: drop-shadow(0 3px 14px rgba(201,168,106,0.42)) drop-shadow(0 1px 0 rgba(255,255,255,0.6));
        }
        @keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
        .gold-leaf-divider{display:flex;align-items:center;justify-content:center;gap:16px;margin:20px 0}

          color:#FFFBF7;
          letter-spacing:0.28em;
          text-transform:uppercase;
          font-size:10.5px;
          padding:14px 32px;
          transition: all .45s cubic-bezier(.2,.8,.2,1);
          box-shadow:0 8px 24px rgba(0,0,0,0.18), inset 0 1px 0 rgba(201,168,106,0.2);

        .count-gold{font-family:'Playfair Display',serif;font-weight:900;color:#C9A86A;text-shadow:0 2px 0 rgba(255,255,255,0.8), 0 4px 18px rgba(201,168,106,0.35);line-height:1;}
        .glass-cream{background:rgba(255,251,247,0.88); border:1px solid rgba(201,168,106,0.22)}

         filter:none !important;
         -webkit-filter:none !important;
         backdrop-filter:none !important;
         -webkit-backdrop-filter:none !important;
         image-rendering: high-quality;
         image-rendering: -webkit-optimize-contrast;
         transform: translateZ(0);
         backface-visibility:hidden;
       }
        /* Fix white gap after hero */
        .hero-wrapper{
          padding-bottom:0 !important;
          margin-bottom:0 !important;
          min-height:100vh !important;
          height:100vh !important;
        }
        .hero-inner{
          min-height:100vh !important;
          height:100vh !important;
          padding-bottom:0 !important;
          margin-bottom:0 !important;
        }
        .hero-countdown{
          margin-bottom:24px !important;
        }
        .hero-reserve{
          margin-bottom:0 !important;
          margin-top:0 !important;
        }
        .after-hero{
          margin-top:0 !important;
          padding-top:40px !important;
        }
        .hq-img{
          filter:none !important;
          -webkit-filter:none !important;
          backdrop-filter:none !important;
          image-rendering: high-quality;
          image-rendering: -webkit-optimize-contrast;

          filter:none !important;
          backdrop-filter:none !important;
