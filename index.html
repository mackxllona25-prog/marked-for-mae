<!DOCTYPE html>
<html lang="en">
<head>

========================= -->

<section id="opening">

<div class="seal">

<h2>M</h2>

<span>&</span>

<h2>C</h2>

<div class="amp">&</div>

<h1>

========================= -->

<div id="website">
